      - name: Publish restored filters independently of price scan
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/catalog.html
          if ! git diff --cached --quiet; then
            git commit -m 'dashboard: restore discounts, filters and expiry [skip ci]'
            git push origin HEAD:fix/real-product-price-reading-v20
          fi
      - name: Install Playwright browser
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Recheck saved product URLs (must verify at least one real price)
        env:
          FOCUS: ${{ inputs.focus }}
          MAX_PRODUCTS: ${{ inputs.max_products }}
        run: |
          set -euo pipefail
          PYTHONPATH=. python recheck_prices_v23.py --focus "$FOCUS" --max-products "$MAX_PRODUCTS" --delay-seconds 2.5
      - name: Upload diagnostics regardless of success
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rk-v23-price-audit
          path: |
            docs/data/catalog_price_review_v23.json
            docs/data/catalog_latest.json
          retention-days: 14
          if-no-files-found: warn
      - name: Persist validated prices and permanent extractor only after success
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monitor.py price_v23.py docs/data/catalog_latest.json docs/data/catalog_price_review_v23.json
          if ! git diff --cached --quiet; then
            git commit -m 'prices: verified whole-pack prices and offer terms [skip ci]'
            git push origin HEAD:fix/real-product-price-reading-v20
          fi
