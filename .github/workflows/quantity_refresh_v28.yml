      - name: Run offline regression tests and snapshot data
        shell: bash
        run: |
          set -euo pipefail
          cd .v28
          python -m unittest discover -s . -p 'test_*.py' -v
          cd ..
          mkdir -p .v28/safety
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          sources=['docs/data/catalog_latest.json','docs/data/taxonomy_v27_public.json','docs/catalog.html']
          for s in sources:assert Path(s).is_file(),s
          price=json.loads(Path(sources[0]).read_text('utf8'))
          tax=json.loads(Path(sources[1]).read_text('utf8'))
          assert len(price['items'])>=1090 and len(tax['items'])==len(price['items'])
          assert len({(p['store'],p['url']) for p in price['items']})==len(price['items'])
          Path('.v28/safety/sha256.json').write_text(json.dumps({s:hashlib.sha256(Path(s).read_bytes()).hexdigest() for s in sources}),encoding='utf8')
          PY

      - name: Install limited browser
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'playwright==1.56.0'
          python -m playwright install chromium

      - name: Recheck only saved Košík Multikup product URLs
        id: verify
        shell: bash
        timeout-minutes: 38
        run: |
          set -euo pipefail
          # The monitor lives under .v28/, while price_v23.py lives at the repo root.
          # Explicitly expose the checkout root to child-script imports.
          export PYTHONPATH="$PWD${PYTHONPATH:+:$PYTHONPATH}"
          python -c "from price_v23 import product_identity; assert callable(product_identity)"
          python .v28/quantity_v28.py \
            --catalog docs/data/catalog_latest.json \
            --report .v28/quantity_v28_report.json \
            --limit 120 --delay 3.5
          python .v28/patch_ui_v28.py docs/catalog.html
          python .v28/patch_ui_v29.py docs/catalog.html
          python - <<'PY'
          from pathlib import Path
          page=Path('docs/catalog.html').read_text('utf8')
          script=page.split('<script>',1)[1].split('</script>',1)[0]
          Path('.v28/page_script.js').write_text(script,encoding='utf8')
          PY
          node --check .v28/page_script.js

      - name: Strict integrity check - prices and taxonomy untouched
        id: integrity
        if: steps.verify.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          from tempfile import TemporaryDirectory
          before=json.loads(subprocess.check_output(['git','show','HEAD:docs/data/catalog_latest.json'],text=True))
          after=json.loads(Path('docs/data/catalog_latest.json').read_text('utf8'))
          protected={'price_czk','price_status','price_source','checked_at','original_price_czk','discount_pct',
                     'multibuy','offer_valid_until','price_history_previous_czk','price_history_previous_at',
                     'drop_since_previous_pct','name','title','url','store','rule_ids','store_category_path','category_source'}
          b=before['items'];a=after['items']
          assert len(b)==len(a)>=1090
          for old,new in zip(b,a):
              assert set(old).issubset(new),f'Existing fields disappeared: {old.get("url")}'
              for key,value in old.items():
                  if key not in {'multibuy_v28_last_attempt_at','multibuy_v28_status','multibuy_v28_note',
                                 'multibuy_v28_verified_at','multibuy_v28_verified_offer','multibuy_v28_source_url'}:
                      assert new[key]==value,(old.get('url'),key)
              for key in protected:
                  assert new.get(key)==old.get(key),(old.get('url'),key)
          for key,val in before.items():
              if key!='items':assert after.get(key)==val,('catalog field changed',key)
          baselines=json.loads(Path('.v28/safety/sha256.json').read_text('utf8'))
          assert hashlib.sha256(Path('docs/data/taxonomy_v27_public.json').read_bytes()).hexdigest()==baselines['docs/data/taxonomy_v27_public.json']
          changed=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert set(changed)<= {'docs/catalog.html','docs/data/catalog_latest.json'},changed
          rep=json.loads(Path('.v28/quantity_v28_report.json').read_text('utf8'))
          assert rep['products']==len(b) and rep['original_price_fields_preserved']
          print('STRICT PASS: 1090 identities, all prices / categories preserved, changed:',changed)
          PY
          git diff --check

      - name: Preserve status report even when merchant blocks requests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rk-v28-quantity-verification-report
          retention-days: 14
          if-no-files-found: ignore
          path: .v28/quantity_v28_report.json

      - name: Publish only verified diagnostic fields and additive HTML
        if: steps.verify.outcome == 'success' && steps.integrity.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/data/catalog_latest.json docs/catalog.html
          if ! git diff --cached --quiet; then
            git commit -m 'v28: verify stored Košík quantity offers without guessing prices [skip ci]'
            git push origin HEAD:refs/heads/fix/real-product-price-reading-v20
          else
            echo 'No monitored changes to publish.'
          fi

      - name: Report actual confirmation rate
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          f=Path('.v28/quantity_v28_report.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf8') as out:
              out.write('## Monitor slev v28 – skutečné ověření Multikupu\n\n')
              if f.exists():
                  d=json.loads(f.read_text('utf8'))
                  for key in ('historical_quantity_offers','selected','attempted','currently_confirmed','statuses','blocked'):
                      out.write(f'- **{key}:** {d.get(key)}\n')
                  out.write('\nOvěření je oddělené od původních cen. Nezjištěné nabídky nejsou platné akce.\n')
              else:
                  out.write('Sběr neposkytl report – změny nebyly publikovány.\n')
          PY

      - name: Fail when verification or integrity guard fails
        if: steps.verify.outcome != 'success' || steps.integrity.outcome != 'success'
        shell: bash
        run: exit 1
