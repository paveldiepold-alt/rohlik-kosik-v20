          #!/usr/bin/env python3
          """Evidence-only discovery of additional Košík Multikup promotions.

          Scans existing, already trusted SKU-linked merchant listing URLs and stages only
          candidates from exact /p<ID> cards in our 1,090-product catalog. No catalogue
          prices, promotions, totals, or identities are changed by this module.
          """
          from __future__ import annotations
          import argparse
          from datetime import datetime, timezone
          import json
          from pathlib import Path
          import re
          import time
          from urllib.parse import urlparse
          from quantity_v28 import parse_header_quantity,product_id

          DISCOVER_JS=r'''() => {
            const found=new Map();
            const sku=(href)=>{try{const u=new URL(href,location.href);if(!/(^|\.)kosik\.cz$/i.test(u.hostname))return null;const m=/^\/p(\d+)(?:-|\/|$)/i.exec(u.pathname);return m?m[1]:null;}catch(e){return null;}};
            for(const link of document.querySelectorAll('a[href]')){
              const id=sku(link.href);if(!id||found.has(id))continue;
              for(let node=link,k=0;node&&k<8;node=node.parentElement,k++){
                const text=(node.innerText||'').trim();
                if(text.length<25||text.length>850)continue;
                if(!/od\s*[2-9]\d*\s*ks/i.test(text)||!/za\s*1\s*ks/i.test(text))continue;
                const ids=new Set([...node.querySelectorAll('a[href]')].map(a=>sku(a.href)).filter(Boolean));
                if(ids.size!==1||!ids.has(id))continue;
                found.set(id,{sku:id,text,href:link.href});break;
              }
            }
            return [...found.values()].slice(0,150);
          }'''

          def trusted_source(url):
              if not isinstance(url,str):return False
              try:
                  u=urlparse(url)
                  return u.scheme=='https' and u.hostname in ('www.kosik.cz','kosik.cz') and not u.username and not u.password and bool(re.match(r'^/s5(?:_|-|/)',u.path))
              except ValueError:return False

          def listing_sources(items):
              return sorted({p.get('multibuy_v28_source_url') for p in items if p.get('store')=='Košík' and trusted_source(p.get('multibuy_v28_source_url'))})

          def select_sources(sources,now,max_pages=8):
              if not sources:return []
              # Two 12-hour windows cycle across all known merchant categories.
              period=now.toordinal()*2+(now.hour//12)
              start=(period*max_pages)%len(sources)
              return [sources[(start+i)%len(sources)] for i in range(min(max_pages,len(sources)))]

          def scan_rows(rows,by_sku,source,seen):
              proposals=[]
              for rec in rows:
                  if not isinstance(rec,dict):continue
                  pid=str(rec.get('sku',''))
                  row=by_sku.get(pid)
                  if row is None or pid in seen or row.get('store')!='Košík':continue
                  if isinstance(row.get('multibuy'),list) and row['multibuy']:continue
                  href=rec.get('href')
                  if product_id(href or '')!=pid:continue
                  offer=parse_header_quantity(rec.get('text'))
                  if not offer:continue
                  base=offer['pack_price_czk'];tiers=offer['tiers']
                  if not tiers or not all(t['price_czk']<base for t in tiers):continue
                  seen.add(pid)
                  proposals.append({'name':row.get('name') or row.get('title'),'url':row['url'],'sku':pid,
                                    'source':source,'pack_price_czk':base,'tiers':tiers,
                                    'status':'candidate_pending_independent_recheck'})
              return proposals

          def discover(db,max_pages=8,delay=3.3):
              from playwright.sync_api import sync_playwright
              now=datetime.now(timezone.utc)
              items=db['items'];sku_map={}
              for row in items:
                  if row.get('store')=='Košík':
                      pid=product_id(row.get('url',''))
                      if pid in sku_map:raise ValueError(f'Duplicate Košík SKU {pid}')
                      if pid:sku_map[pid]=row
              sources=listing_sources(items)
              chosen=select_sources(sources,now,max_pages)
              report={'schema':'rk-v31-multibuy-discovery-staging','at':now.isoformat(timespec='seconds'),
                      'total_trusted_listing_sources':len(sources),'selected_listing_sources':len(chosen),
                      'checked_pages':0,'blocked':False,'errors':[],'candidates':[],'new_candidates':0,
                      'note':'Review-only! These candidates are NOT added to confirmed promotions or to the product catalogue.'}
              seen=set()
              if not chosen:return report
              with sync_playwright() as pw:
                  browser=pw.chromium.launch(headless=True,args=['--no-sandbox'])
                  try:
                      ctx=browser.new_context(locale='cs-CZ',timezone_id='Europe/Prague',viewport={'width':1366,'height':900})
                      page=ctx.new_page()
                      for source in chosen:
                          if not trusted_source(source):raise AssertionError('Untrusted source in candidate list')
                          time.sleep(delay)
                          try:
                              rsp=page.goto(source,wait_until='domcontentloaded',timeout=20000)
                              code=rsp.status if rsp else None
                              if code in (403,429,503):
                                  report['blocked']=True;report['errors'].append(f'HTTP {code}');break
                              if code!=200:
                                  report['errors'].append('HTTP '+str(code)+' '+source);continue
                              report['checked_pages']+=1
                              for scroll in range(5):
                                  page.wait_for_timeout(300)
                                  rows=page.evaluate(DISCOVER_JS)
                                  report['candidates']+=scan_rows(rows,sku_map,source,seen)
                                  if scroll<4:page.evaluate('window.scrollBy(0,1050)')
                          except Exception as exc:
                              report['errors'].append(type(exc).__name__+': '+str(exc)[:90])
                      ctx.close()
                  finally:browser.close()
              report['new_candidates']=len(report['candidates'])
              return report

          def main():
              pa=argparse.ArgumentParser()
              pa.add_argument('--catalog',required=True);pa.add_argument('--report',required=True)
              pa.add_argument('--pages',type=int,default=8);pa.add_argument('--delay',type=float,default=3.3)
              args=pa.parse_args()
              if not 1<=args.pages<=12 or not 3.3<=args.delay<=30:raise SystemExit('Unsafe discovery batch')
              db=json.loads(Path(args.catalog).read_text('utf8'))
              rep=discover(db,args.pages,args.delay)
              target=Path(args.report);target.parent.mkdir(parents=True,exist_ok=True)
              target.write_text(json.dumps(rep,ensure_ascii=False,indent=2)+'\n',encoding='utf8')
              print(json.dumps({k:v for k,v in rep.items() if k!='candidates'},ensure_ascii=False))

          if __name__=='__main__':main()
