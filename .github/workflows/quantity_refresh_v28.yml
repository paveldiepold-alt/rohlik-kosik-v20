              if key!='items':assert after.get(key)==val,('catalog field changed',key)
          baselines=json.loads(Path('.v28/safety/sha256.json').read_text('utf8'))
          assert hashlib.sha256(Path('docs/data/taxonomy_v27_public.json').read_bytes()).hexdigest()==baselines['docs/data/taxonomy_v27_public.json']
          changed=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          assert set(changed)<= {'docs/catalog.html','docs/data/catalog_latest.json'},changed
          rep=json.loads(Path('.v28/quantity_v28_report.json').read_text('utf8'))
          assert rep['products']==len(b) and rep['original_price_fields_preserved']
          print('STRICT PASS: 1090 identities, all prices / categories preserved, changed:',changed)
          PY
          git diff --check


      - name: Production v31 - audit data freshness and display verified single-pack prices
        id: production
        if: steps.verify.outcome == 'success' && steps.integrity.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/.v28:$PWD${PYTHONPATH:+:$PYTHONPATH}"
          python .v28/production_v31.py \
            --catalog docs/data/catalog_latest.json \
            --taxonomy docs/data/taxonomy_v27_public.json \
            --html docs/catalog.html \
            --report docs/data/production_health_v31.json
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          report=json.loads(Path('docs/data/production_health_v31.json').read_text('utf8'))
          assert report['products']>=1090
          assert report['verified_distinct_offers']<=report['ordinary_verified_discounts']+report['fresh_verified_quantity_offers']
          assert report['stored_prices_ok']+report['stored_prices_unverified']==report['products']
          assert report['postcode_verified_products']<=report['products']
          assert report['quantity_current_pack_prices_display_only']
          html=Path('docs/catalog.html').read_text('utf8')
          assert 'const effectiveSinglePrice=p=>' in html
          assert 'data/production_health_v31.json' in html
          Path('.v28/page_script.js').write_text(html.split('<script>',1)[1].split('</script>',1)[0],encoding='utf8')
          changed=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert changed <= {'docs/catalog.html','docs/data/catalog_latest.json','docs/data/production_health_v31.json'},changed
          unknown=set(subprocess.check_output(['git','ls-files','--others','--exclude-standard','docs/data'],text=True).splitlines())
          assert unknown <= {'docs/data/production_health_v31.json'},unknown
          print('PRODUCTION V31 PASS:',report['verified_distinct_offers'],'offers,',report['quantity_current_stored_price_mismatch'],'current/catalog base-price mismatches')
          PY
          node --check .v28/page_script.js
          git diff --check

      - name: v31 - stage evidence of NEW quantity offers (never publish as verified)
        id: discovery
        if: steps.production.outcome == 'success'
        shell: bash
        timeout-minutes: 10
        continue-on-error: true
        run: |
          set -euo pipefail
          export PYTHONPATH="$PWD/.v28:$PWD${PYTHONPATH:+:$PYTHONPATH}"
          python .v28/discovery_v31.py \
            --catalog docs/data/catalog_latest.json \
            --report .v28/discovery_v31_staging.json \
            --pages 8 --delay 3.5
          test -z "$(git status --porcelain -- docs/data/taxonomy_v27_public.json)"

      - name: Upload production and discovery diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rk-v31-production-audit-and-candidates
          retention-days: 21
          if-no-files-found: warn
          path: |
            docs/data/production_health_v31.json
            .v28/discovery_v31_staging.json

      - name: Preserve status report even when merchant blocks requests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rk-v28-quantity-verification-report
          retention-days: 14
          if-no-files-found: ignore
          path: .v28/quantity_v28_report.json

      - name: Publish only verified diagnostic fields and additive HTML
        if: steps.verify.outcome == 'success' && steps.integrity.outcome == 'success' && steps.production.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/data/catalog_latest.json docs/catalog.html docs/data/production_health_v31.json
          if ! git diff --cached --quiet; then
            git commit -m 'v28: verify stored Košík quantity offers without guessing prices [skip ci]'
            git push origin HEAD:refs/heads/fix/real-product-price-reading-v20
          else
            echo 'No monitored changes to publish.'
          fi

      - name: Report actual confirmation rate
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          f=Path('.v28/quantity_v28_report.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf8') as out:
              out.write('## Monitor slev v28 – skutečné ověření Multikupu\n\n')
              if f.exists():
                  d=json.loads(f.read_text('utf8'))
                  for key in ('historical_quantity_offers','selected','attempted','currently_confirmed','statuses','blocked'):
                      out.write(f'- **{key}:** {d.get(key)}\n')
                  out.write('\nOvěření je oddělené od původních cen. Nezjištěné nabídky nejsou platné akce.\n')
              else:
                  out.write('Sběr neposkytl report – změny nebyly publikovány.\n')
          PY

      - name: Fail when verification or integrity guard fails
        if: steps.verify.outcome != 'success' || steps.integrity.outcome != 'success' || steps.production.outcome != 'success'
        shell: bash
        run: exit 1
