          #!/usr/bin/env python3
          """Production v31: strict, non-destructive catalogue health check and UI single-pack reconciliation.

          This does NOT rewrite any original catalog price, historical discount or category.
          A verified quantity price supersedes the older saved single-unit price only in the UI
          for the 36-hour evidence lifetime; every discrepancy is retained in the audit.
          """
          from __future__ import annotations
          import argparse
          from collections import Counter
          from datetime import datetime, timezone
          import json
          from pathlib import Path
          import re
          from urllib.parse import urlparse
          from zoneinfo import ZoneInfo

          BASELINE=1090
          HOURS_QUANTITY=36
          HOURS_REGULAR=72


          def _timestamp(value):
              if not isinstance(value,str) or 'T' not in value:return None
              try:
                  dt=datetime.fromisoformat(value.replace('Z','+00:00'))
                  return dt.astimezone(timezone.utc) if dt.tzinfo else None
              except (ValueError,OverflowError):return None


          def age_hours(stamp,now):
              dt=_timestamp(stamp)
              return (now-dt).total_seconds()/3600 if dt else float('inf')


          def _value(v):
              return type(v) in (int,float) and 0.01 < v < 100000


          def _saved_offer(row):
              price=row.get('price_czk')
              return _value(price) and isinstance(row.get('multibuy'),list) and any(
                  isinstance(x,dict) and type(x.get('min_qty')) is int and 2<=x['min_qty']<=24
                  and _value(x.get('price_czk')) and x['price_czk']<price
                  for x in row['multibuy'])


          def confirmed(row,now):
              """Only source-backed, SKU-linked, recent, internally consistent offers."""
              if not _saved_offer(row) or row.get('store')!='Košík' or row.get('multibuy_v28_status')!='verified':return False
              ts=row.get('multibuy_v28_verified_at')
              if not 0 <= age_hours(ts,now) <= HOURS_QUANTITY:return False
              source=row.get('multibuy_v28_source_url')
              if not isinstance(source,str):return False
              try:
                  u=urlparse(source)
                  if u.scheme!='https' or u.hostname not in ('www.kosik.cz','kosik.cz') or u.username or u.password:return False
                  if not re.match(r'^/(?:p\d+[-/]|s5(?:_|-|/))',u.path):return False
              except ValueError:return False
              offer=row.get('multibuy_v28_verified_offer')
              if not isinstance(offer,dict):return False
              base=offer.get('pack_price_czk')
              if not _value(base):return False
              tiers=offer.get('tiers')
              if not isinstance(tiers,list) or not tiers:return False
              prev_qty=1;prev_price=base
              for x in tiers:
                  if not isinstance(x,dict):return False
                  qty=x.get('min_qty');price=x.get('price_czk')
                  if type(qty) is not int or not prev_qty<qty<=24:return False
                  if not _value(price) or price>=base or price>prev_price:return False
                  prev_qty=qty;prev_price=price
              return True


          def regular_promo(row,now):
              price=row.get('price_czk');old=row.get('original_price_czk');disc=row.get('discount_pct')
              if row.get('price_status')!='ok' or not (_value(price) and _value(old)) or old<=price:return False
              if type(disc) not in (int,float) or disc<=0:return False
              if not 0<=age_hours(row.get('checked_at'),now)<=HOURS_REGULAR:return False
              until=row.get('offer_valid_until')
              if until and (not isinstance(until,str) or until<now.astimezone(ZoneInfo('Europe/Prague')).date().isoformat()):return False
              return True


          def build_audit(catalog,taxonomy,now=None,min_products=BASELINE):
              now=now or datetime.now(timezone.utc)
              items=catalog['items'];overlay=taxonomy['items']
              if len(items)<min_products or len(overlay)!=len(items):raise ValueError('Unexpected catalog or taxonomy size')
              key=lambda p:(p.get('store'),p.get('url'))
              keys=[key(p) for p in items]
              if len(set(keys))!=len(keys) or set(keys)!={key(p) for p in overlay}:
                  raise ValueError('Product identities mismatch or duplicate')
              verified=[p for p in items if confirmed(p,now)]
              normal=[p for p in items if regular_promo(p,now)]
              combined={key(p) for p in verified}|{key(p) for p in normal}
              mismatch=[]
              for p in verified:
                  base=p['multibuy_v28_verified_offer']['pack_price_czk']
                  if abs(base-p['price_czk'])>0.011:
                      mismatch.append({'store':p['store'],'name':p.get('name',p.get('title','')),'url':p['url'],
                                       'catalog_single_price_czk':p['price_czk'],
                                       'quantity_verified_single_price_czk':base,
                                       'verified_at':p.get('multibuy_v28_verified_at')})
              status=Counter(p.get('multibuy_v28_status','not_checked') for p in items if _saved_offer(p))
              categories=Counter(p.get('category_v27',{}).get('status','unknown') for p in overlay)
              price_age=age_hours(catalog.get('last_price_monitor_at'),now)
              warnings=[]
              if price_age>12:warnings.append('Price scan is older than 12 hours')
              if mismatch:warnings.append('Verified current single-unit prices differ from original stored prices; dashboard uses fresh evidence and retains history')
              postcode=sum(p.get('postcode_verified') is True for p in items)
              if postcode==0:warnings.append('Availability and actual price for a delivery postcode are not verified')
              if len(items)-sum(p.get('price_status')=='ok' for p in items)>0:warnings.append('Some products still lack a confirmed stored price')
              mapped=sum(bool(p.get('category_v27',{}).get('category')) for p in overlay)
              report={
                'schema':'rk-production-health-v31','generated_at':now.isoformat(timespec='seconds'),
                'quality':'attention' if warnings else 'ok',
                'products':len(items),'store_counts':dict(Counter(p.get('store') for p in items)),
                'stored_prices_ok':sum(p.get('price_status')=='ok' for p in items),
                'stored_prices_unverified':sum(p.get('price_status')!='ok' for p in items),
                'ordinary_verified_discounts':len(normal),'fresh_verified_quantity_offers':len(verified),
                'verified_distinct_offers':len(combined),'overlap_between_types':len(normal)+len(verified)-len(combined),
                'saved_quantity_offers':sum(_saved_offer(p) for p in items),
                'quantity_statuses':dict(status),
                'quantity_current_stored_price_mismatch':len(mismatch),
                'quantity_current_stored_price_mismatch_examples':mismatch[:20],
                'quantity_current_pack_prices_display_only':True,
                'price_monitor_last_at':catalog.get('last_price_monitor_at'),
                'price_monitor_age_hours':round(price_age,2) if price_age!=float('inf') else None,
                'postcode_verified_products':postcode,
                'category_statuses':dict(categories),'categories_with_merchant_mapping':mapped,
                'warnings':warnings,
                'methodology':'Current discounts require price checked within 72h; quantity offers require independently verified merchant product/offer within 36h. Old catalog prices are not rewritten. All offers deduplicated by merchant and exact product URL.'
              }
              return report


          def patch_html(html):
              marker='const effectiveSinglePrice=p=>'
              if marker in html:
                  needed=('effectiveSinglePrice(p)','Cena ověřena z Multikupu','data/production_health_v31.json')
                  if not all(x in html for x in needed):raise ValueError('Partial production v31 HTML integration')
                  return html
              def once(old,new):
