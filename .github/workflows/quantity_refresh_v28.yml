name: Monitor slev v28 - Aktualni mnozstevni nabidky

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/quantity_refresh_v28.yml'
  schedule:
    - cron: '37 1,13 * * *'

permissions:
  contents: write

concurrency:
  group: rk-v20-catalog
  cancel-in-progress: false

jobs:
  quantity-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout published data and dashboard (not main)
        uses: actions/checkout@v4
        with:
          ref: fix/real-product-price-reading-v20
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Python and Node
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Create isolated monitor and regression tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .v28
          cat > .v28/quantity_v28.py <<'PYV28_quantity_v28_py'
          #!/usr/bin/env python3
          """Conservative, read-only re-verification of stored Košík quantity offers.

          Never writes existing prices, history, discounts or saved multibuy terms.
          Adds only independent v28 evidence, so an older quantity offer is not
          misrepresented as currently confirmed.
          """
          from __future__ import annotations
          import argparse
          import copy
          from collections import Counter
          from datetime import datetime, timezone
          import json
          from pathlib import Path
          import re
          import time
          from urllib.parse import urlparse

          MIN_DELAY = 3.3
          MONEY = r'(?:\d{1,3}(?:[ \u00a0\u202f]\d{3})*|\d{1,5})(?:[., ]\d{2})'
          MULTI = re.compile(r'(?P<sale>'+MONEY+r')\s*od\s*(?P<qty>\d+)\s*ks\b', re.I)
          ONE = re.compile(r'(?P<price>'+MONEY+r')\s*K[cč]\s*za\s*1\s*ks\b', re.I)
          STOP = re.compile(r'(?i)^(?:do košíku|související varianty|další varianty|podobné produkty|produkty značky|popis produktu|značka\s*:)')
          HEADER_JS = r'''() => {
            const h=document.querySelector('h1');
            if (!h) return {title:'',text:''};
            const title=(h.innerText||h.textContent||'').trim();
            const main=h.closest('main')||document.querySelector('main')||document.body;
            const raw=main.innerText||'';
            const pos=raw.indexOf(title);
            if(pos<0)return {title,text:''};
            const rest=raw.slice(pos+title.length,pos+title.length+1500);
            // Never inspect prices from related products after the first Add-to-cart.
            const stop=/(?:^|\n)\s*(?:Do košíku|Související varianty(?: v Multikupu)?|Další varianty|Podobné produkty|Značka\s*:)/im.exec(rest);
            return {title,text:stop?rest.slice(0,stop.index):rest};
          }'''


          def amount(s):
              s=str(s or '').replace('\u00a0',' ').replace('\u202f',' ').strip()
              if not s:return None
              if re.fullmatch(r'\d{1,5}[,.]\d{2}',s):
                  v=float(s.replace(',','.'))
              elif re.fullmatch(r'(?:\d{1,3}(?: \d{3})*|\d{1,5}) \d{2}',s):
                  parts=s.split(' ')
                  v=float(''.join(parts[:-1]))+int(parts[-1])/100
              else:
                  return None
              return round(v,2) if 0.5<=v<=50000 else None



          def parse_detail_multikup(lines):
              """Parse a product-scoped Košík 'Multikup – množstevní sleva' panel.

              Real shop text renders in BOTH patterns:
                 35,90 Kč od 2 ks / –10 % / 31,90 Kč od 3 ks / –20 % / 39 90
                 35,90 Kč / -10 % / od 2 ks / 39 90
              The caller takes only the target product's pre-Add-to-cart header.
              A related variant, unit price, or non-Multikup promotion is insufficient.
              """
              heads=[i for i,ln in enumerate(lines) if re.search(r'(?i)\bmultikup\b.*množstevní\s+sleva',ln)]
              if len(heads)!=1:return None
              block=lines[heads[0]+1:heads[0]+25]
              records=[]
              for i,ln in enumerate(block):
                  # Košík's actual product display often places Kč before 'od N ks'.
                  inline=re.fullmatch(r'(.+?)\s*(?:Kč|CZK)?\s+od\s*(\d+)\s*ks',ln,re.I)
                  if inline:
                      qty=int(inline[2])
                      sale=amount(re.sub(r'\s*(?:Kč|CZK)\s*$','',inline[1],flags=re.I).strip())
                      if sale is None or not 2<=qty<=24:continue
                      # Discount percentage is displayed on the line immediately below.
                      adjacent=block[i+1] if i+1<len(block) else ''
                      pct=re.fullmatch(r'[−–—-]\s*(\d{1,2})\s*%',adjacent)
                      records.append((qty,sale,int(pct[1]) if pct else None,i+int(pct is not None)))
                      continue
                  qtyline=re.fullmatch(r'od\s*(\d+)\s*ks',ln,re.I)
                  if not qtyline or not 2<=int(qtyline[1])<=24:continue
                  # Alternative: amount / -N % / od N ks on three lines.
                  if i<2:continue
                  pct=re.fullmatch(r'[−–—-]\s*(\d{1,2})\s*%',block[i-1])
                  if not pct:continue
                  sale=amount(re.sub(r'\s*(?:Kč|CZK)\s*$','',block[i-2],flags=re.I).strip())
                  if sale is not None:records.append((int(qtyline[1]),sale,int(pct[1]),i))
              if not records:return None
              # Only a whole-package amount after the last price tier, not Kč/kg or
              # a price for a related/alternative SKU. The calling header stops at Add-to-cart.
              end=max(x[3] for x in records)
              base=None
              for ln in block[end+1:end+5]:
                  if re.search(r'(?i)(?:kč|czk)\s*/\s*(?:kg|l|ks|m|g|ml|100\s*g)',ln):break
                  v=amount(re.sub(r'\s*(?:Kč|CZK)\s*$','',ln,flags=re.I).strip())
                  if v is not None:
                      base=v;break
              if base is None:return None
              if len({x[0] for x in records})!=len(records):return None
              for qty,sale,pct,_ in records:
                  if sale>=base:return None
                  if pct is not None and (not 1<=pct<=90 or abs(100*(1-sale/base)-pct)>2.5):return None
              ordered=[{'min_qty':qty,'price_czk':sale} for qty,sale,pct,_ in sorted(records)]
              if any(b['price_czk']>a['price_czk'] for a,b in zip(ordered,ordered[1:])):return None
              return {'pack_price_czk':base,'tiers':ordered}

          def parse_header_quantity(text):
              """Require explicit quantity, one-item pack price and strictly better cost.

              Generic unit-price labels, related items and crossed prices alone do not
              substantiate a Multikup. No name-based guessing is allowed.
              """
              if not isinstance(text,str):return None
              text=text.replace('\u00a0',' ').replace('\u202f',' ')
              lines=[re.sub(r'\s+',' ',line).strip() for line in text.splitlines()]
              cleaned=[]
              for line in lines:
                  if not line: continue
                  if STOP.match(line):break
                  cleaned.append(line)
                  if len(cleaned)>=32:break
              # Košík product detail uses an explicit multi-tier card with percentages.
              # Only within the exact product's price header, not related products.
              detail=parse_detail_multikup(cleaned)
              if detail is not None:return detail
              candidates=[];one=None
              for line in cleaned:
                  found=ONE.search(line)
                  if found:
                      one=amount(found.group('price'))
                  match=MULTI.search(line)
                  if match:
                      qty=int(match.group('qty'))
                      price=amount(match.group('sale'))
                      if 2<=qty<=24 and price is not None:
                          candidates.append({'min_qty':qty,'price_czk':price})
              # Browser text may split the whole-crown and heller price onto separate lines:
              # '35' + '90' + 'od 2 ks', or '39' + '90' + 'Kč za 1 ks'.
              # Require explicit adjacent quantity labels to avoid unit-price confusion.
              if one is None:
                  for i,line in enumerate(cleaned):
                      if re.fullmatch(r'(?i)(?:Kč|CZK)\s+za\s+1\s*ks',line):
                          for n in (1,2):
                              if i>=n:
                                  v=amount(' '.join(cleaned[i-n:i]))
                                  if v is not None:one=v;break
                          if one is not None:break
              if not candidates:
                  for i,line in enumerate(cleaned):
                      mm=re.fullmatch(r'od\s*(\d+)\s*ks',line,re.I)
                      if not mm or not 2<=int(mm[1])<=24:continue
                      for n in (2,1):
                          if i>=n:
                              v=amount(' '.join(cleaned[i-n:i]))
                              if v is not None:
                                  candidates.append({'min_qty':int(mm[1]),'price_czk':v})
                                  break
              # Some rendering places the price and the condition on consecutive lines.
              # Preserve specificity: we only accept a 2-decimal pair directly before 'od N ks'.
              if not candidates:
                  for prev,nxt in zip(cleaned,cleaned[1:]):
                      if re.fullmatch(r'\d{1,5}[., ]\d{2}',prev):
                          m=re.fullmatch(r'od\s*(\d+)\s*ks',nxt,re.I)
                          if m and 2<=int(m[1])<=24:
                              v=amount(prev)
                              if v is not None:candidates.append({'min_qty':int(m[1]),'price_czk':v})
              if one is None and not candidates and any('nakupte více za méně' in x.casefold() for x in cleaned):
                  for i,line in enumerate(cleaned):
                      mm=re.fullmatch(r'od\s*(\d+)\s*ks',line,re.I)
                      if not mm or not 2<=int(mm[1])<=24 or i<2:continue
                      pct=re.search(r'[-−]\s*(\d{1,2})\s*%',cleaned[i-1])
                      if not pct or ' do ' in cleaned[i-1].casefold():continue
                      sale=amount(re.sub(r'\s*(?:Kč|CZK)\s*$','',cleaned[i-2],flags=re.I))
                      if sale is None:continue
                      for following in cleaned[i+1:i+4]:
                          base=amount(re.sub(r'\s*(?:Kč|CZK)\s*$','',following,flags=re.I))
                          if base and base>sale and abs(100*(1-sale/base)-int(pct[1]))<=2.5:
                              return {'pack_price_czk':base,'tiers':[{'min_qty':int(mm[1]),'price_czk':sale}]}
              if one is None or not candidates:
                  return None
              dedup={x['min_qty']:x for x in candidates if x['price_czk']<one}
              if not dedup:
                  return None
              offers=[dedup[k] for k in sorted(dedup)]
              # Quantity-dependent prices must be monotonically nonincreasing.
              if any(b['price_czk']>a['price_czk'] for a,b in zip(offers,offers[1:])):
                  return None
              return {'pack_price_czk':one,'tiers':offers}


          def eligible(row):
              if row.get('store')!='Košík' or not isinstance(row.get('multibuy'),list) or not row['multibuy']:
                  return False
              u=row.get('url','')
              try:
                  p=urlparse(u)
                  return p.scheme=='https' and p.hostname in ('www.kosik.cz','kosik.cz') and not p.username and not p.password
              except (ValueError,TypeError):
                  return False


          def apply_result(row,result,now):
              """Annotate independently; never change any preexisting commerce fields."""
              out=dict(row)
              out['multibuy_v28_last_attempt_at']=now
              out['multibuy_v28_status']=result['status']
              out['multibuy_v28_note']=str(result.get('note',''))[:180]
              if result['status']=='verified':
                  out['multibuy_v28_verified_at']=now
                  out['multibuy_v28_verified_offer']=copy.deepcopy(result['offer'])
              out['multibuy_v28_source_url']=result.get('source_url')
              return out


          # v29: Product-scoped fallback for Košík Multikup category cards.
          # A merchant category card MUST link to the exact /p<ID> from our catalog.
          LISTING_JS = r'''(productId) => {
            const ids = (root) => {
              const result = new Set();
              for (const a of root.querySelectorAll('a[href]')) {
                try {
                  const u = new URL(a.href, location.href);
                  if (!/(^|\.)kosik\.cz$/i.test(u.hostname)) continue;
                  const m = /^\/p(\d+)(?:-|\/|$)/i.exec(u.pathname);
                  if (m) result.add(m[1]);
                } catch (_) {}
              }
              return result;
            };
            const links = [...document.querySelectorAll('a[href]')].filter(a => {
              try {
                const u = new URL(a.href, location.href);
                const m = /^\/p(\d+)(?:-|\/|$)/i.exec(u.pathname);
                return /(^|\.)kosik\.cz$/i.test(u.hostname) && m && m[1] === productId;
              } catch (_) { return false; }
            });
            for (const link of links) {
              let node = link;
              for (let level = 0; node && level < 8; level++, node = node.parentElement) {
                const text = (node.innerText || '').trim();
                if (text.length < 25 || text.length > 850) continue;
                if (!/od\s*[2-9]\d*\s*ks/i.test(text) || !/za\s*1\s*ks/i.test(text)) continue;
                const contained = ids(node);
                if (contained.size !== 1 || !contained.has(productId)) continue;
                return {text,productId,href:link.href,source:location.href};
              }
            }
            return null;
          }'''

          def product_id(url):
              # Use exact retailer SKU to prevent accepting prices for variants.
              m=re.search(r'/p(\d+)(?:-|/|$)',urlparse(url).path,re.I)
              return m.group(1) if m else None

          def listing_candidates(page):
              # From the product's breadcrumb: Multikup section scoped to that category.
              paths=page.evaluate(r'''() => [...document.querySelectorAll('a[href]')]
                .map(a => {try{return new URL(a.href,location.href).pathname}catch(e){return ''}})
                .filter(x => /^\/c\d+(?:-[^/]+)?$/i.test(x)).slice(0,32)''')
              result=[]
              for path in reversed(paths[-4:]):
                  special='/s5_'+path.lstrip('/')
                  url='https://www.kosik.cz'+special
                  if url not in result: result.append(url)
              result.append('https://www.kosik.cz/s5-multikup')
              return result[:4]

          def from_listing(page,row,candidates):
              pid=product_id(row.get('url',''))
              if not pid:
                  return {'status':'invalid_product_id','note':'Missing trusted Košík SKU in URL','blocked':False}
              errors=[]
              for location in candidates:
                  try:
                      rsp=page.goto(location,wait_until='domcontentloaded',timeout=18000)
                      code=rsp.status if rsp else None
                      if code in (403,429,503):
                          return {'status':'throttled','note':f'Multikup listing HTTP {code}','blocked':True}
                      if code!=200:
                          errors.append('HTTP '+str(code)); continue
                      page.wait_for_timeout(500)
                      for offset in range(4):
                          card=page.evaluate(LISTING_JS,pid)
                          if card:
                              offer=parse_header_quantity(card['text'])
                              if offer is not None:
                                  return {'status':'verified','offer':offer,
                                          'note':'SKU-linked Multikup card, explicit 1ks and quantity price',
                                          'source_url':location,'blocked':False}
                              return {'status':'ambiguous_card','note':'SKU matched; ambiguous text: '+re.sub(r'\s+',' ',card.get('text',''))[:100],'blocked':False}
                          if offset<3:
                              page.evaluate('window.scrollBy(0,1100)')
                              page.wait_for_timeout(300)
                  except Exception as exc:
                      errors.append(type(exc).__name__)
              return {'status':'not_observed','note':'No SKU-linked current Multikup card ('+','.join(errors[:2])+')','blocked':False}

          def inspect(page,row):
              # Preserve original detail verification; fallback checks SKU-linked Multikup listings.
              from price_v23 import product_identity
              try:
                  response=page.goto(row['url'],wait_until='domcontentloaded',timeout=25000)
                  code=response.status if response else None
                  if code in (403,429,503):
                      return {'status':'throttled','note':'Product detail HTTP '+str(code),'blocked':True}
                  if code!=200:
                      return {'status':'http_error','note':'Product detail HTTP '+str(code),'blocked':False}
                  page.wait_for_timeout(550)
                  data=page.evaluate(HEADER_JS)
                  target=product_id(row['url'])
                  actual=product_id(page.url)
                  if not target or actual != target:
                      return {'status':'sku_redirect','note':'Product detail redirected to different SKU','blocked':False}
                  same_title=product_identity(row.get('title') or row.get('name'),data.get('title'))
                  offer=parse_header_quantity(data.get('text')) if same_title else None
                  if offer is not None:
                      return {'status':'verified','offer':offer,'note':'Exact product detail and explicit quantity / regular price','source_url':row['url'],'blocked':False}
                  # A valid price in a current regular promotion is not automatically a Multikup.
                  # Check SKU-linked merchant category cards instead of rejecting 87 offers here.
                  candidates=listing_candidates(page)
                  result=from_listing(page,row,candidates)
                  if result['status']=='not_observed' and not same_title:
                      result['status']='title_mismatch'
                      result['note']='Title differs; SKU-linked Multikup card not found'
                  return result
              except Exception as e:
                  return {'status':'error','note':f'{type(e).__name__}: {str(e)[:90]}','blocked':False}


          def process(db, scanner, *, limit=120, delay=3.3, sleep=time.sleep):
              """Scanner callback is injectible for deterministic offline tests."""
              before=copy.deepcopy(db)
              out=copy.deepcopy(db)
              items=out['items']
              ids=[(x.get('store'),x.get('url')) for x in items]
              if len(ids)!=len(set(ids)) or len(ids)<1090:
                  raise ValueError('Identity collision or unexpectedly small catalogue')
              selected=sorted([(i,row) for i,row in enumerate(items) if eligible(row)],key=lambda x:x[1].get('multibuy_v28_last_attempt_at',''))[:limit]
              started=time.monotonic()
              stats=Counter();attempted=0;blocked=False
              for index,row in selected:
                  if blocked:break
                  if time.monotonic()-started>30*60:
                      stats['time_budget_remaining']=len(selected)-attempted
                      break
                  sleep(delay)
                  res=scanner(row)
                  at=datetime.now(timezone.utc).isoformat(timespec='seconds')
                  items[index]=apply_result(row,res,at)
                  attempted+=1;stats[res['status']]+=1
                  if res.get('blocked'):blocked=True
              # Strict preservation: no prior field or entire product record can disappear.
              for prev,new in zip(before['items'],out['items']):
                  for k,v in prev.items():
                      if k not in new or (k not in {'multibuy_v28_last_attempt_at','multibuy_v28_status','multibuy_v28_note','multibuy_v28_verified_at','multibuy_v28_verified_offer','multibuy_v28_source_url'} and new[k]!=v):
                          raise AssertionError('Unexpected modification of existing commerce field: '+str(k))
              report={'schema':'rk-v28-quantity-evidence','at':datetime.now(timezone.utc).isoformat(timespec='seconds'),
                 'products':len(items),'selected':len(selected),'attempted':attempted,
                 'statuses':dict(stats),'blocked':blocked,
                 'currently_confirmed':sum(
                   eligible(x) and x.get('multibuy_v28_status')=='verified' and
                   (lambda t: t is not None and 0 <= (datetime.now(timezone.utc)-t).total_seconds()<=36*3600)(
                      datetime.fromisoformat(x['multibuy_v28_verified_at'].replace('Z','+00:00'))
                      if isinstance(x.get('multibuy_v28_verified_at'),str) and 'T' in x.get('multibuy_v28_verified_at','') else None)
                   for x in items),
                 'historical_quantity_offers':sum(eligible(x) for x in items),
                 'original_price_fields_preserved':True}
              return out,report


          def main():
              parser=argparse.ArgumentParser()
              parser.add_argument('--catalog',default='docs/data/catalog_latest.json')
              parser.add_argument('--report',default='docs/data/quantity_v28_report.json')
              parser.add_argument('--limit',type=int,default=120)
              parser.add_argument('--delay',type=float,default=3.3)
              args=parser.parse_args()
              if not 1<=args.limit<=120 or not MIN_DELAY<=args.delay<=30:
                  raise SystemExit('Unsafe limit/delay')
              from playwright.sync_api import sync_playwright
              with open(args.catalog,encoding='utf8') as f: db=json.load(f)
              with sync_playwright() as pw:
                  browser=pw.chromium.launch(headless=True,args=['--no-sandbox'])
                  try:
                      ctx=browser.new_context(locale='cs-CZ',timezone_id='Europe/Prague',viewport={'width':1366,'height':900})
                      page=ctx.new_page()
                      out,rep=process(db,lambda row:inspect(page,row),limit=args.limit,delay=args.delay)
                      ctx.close()
                  finally:browser.close()
              p=Path(args.report);p.parent.mkdir(parents=True,exist_ok=True)
              p.write_text(json.dumps(rep,ensure_ascii=False,indent=2)+'\n',encoding='utf8')
              # Report-only on a blocked/zero-attempt run; never regress price observations.
              if rep['attempted']>0:
                  dst=Path(args.catalog); tmp=dst.with_suffix('.json.tmp')
                  tmp.write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf8');tmp.replace(dst)
              print(json.dumps(rep,ensure_ascii=False))

          if __name__=='__main__':main()
          PYV28_quantity_v28_py
          cat > .v28/patch_ui_v28.py <<'PYV28_patch_ui_v28_py'
          #!/usr/bin/env python3
          """Idempotent v28 quantity-verification UI integration, HTML-only."""
          import argparse
          from pathlib import Path

          OLD = "const multiUnconfirmed=p=>!freshPrice(p)||(String(p.last_monitor_attempt_at||'')>String(p.checked_at||'')&&p.monitor_v26_status!=='ok');"
          NEW = """const multiUnconfirmed=p=>{
           const e=p.multibuy_v28_verified_offer,ts=Date.parse(p.multibuy_v28_verified_at||'');
           return !(p.multibuy_v28_status==='verified'&&Number.isFinite(ts)&&Date.now()>=ts&&
           (Date.now()-ts)<=36*3600000&&e&&Array.isArray(e.tiers)&&e.tiers.length>0&&
           typeof e.pack_price_czk==='number'&&Math.abs(e.pack_price_czk-p.price_czk)<0.011);
          };"""
          OLD_COND = "if(Array.isArray(p.multibuy))for(const x of p.multibuy){if(Number(x.min_qty)>=2&&typeof x.price_czk==='number')result.push(`od ${Number(x.min_qty)} ks za ${money(x.price_czk)}`+(multiUnconfirmed(p)?' (poslední kontrola nepotvrdila)':''))}"
          NEW_COND = """const pending=multiUnconfirmed(p);
           const tiers=(!pending&&p.multibuy_v28_verified_offer?.tiers)||p.multibuy;
           if(Array.isArray(tiers))for(const x of tiers){if(Number(x.min_qty)>=2&&typeof x.price_czk==='number')
           result.push(`od ${Number(x.min_qty)} ks za ${money(x.price_czk)}`+
           (pending?' (uloženo dříve, nyní nepotvrzeno)':' (aktuálně ověřeno)'))}"""


          def patch(html):
              if 'const multiUnconfirmed=p=>{\n const e=p.multibuy_v28_verified_offer' in html:
                  assert 'aktuálně ověřeno' in html and 'id="qMultiConfirmed"' in html
                  return html
              patches=[
                (OLD,NEW),(OLD_COND,NEW_COND),
                ('id="qMulti">—</span></button>',
                 'id="qMulti">—</span></button>\n'
                 '  <button type="button" data-quick="multi-verified" title="Jen nově potvrzené množstevní ceny.">✓ Množstevní potvrzené <span id="qMultiConfirmed">—</span></button>'),
                ("if(view==='multi'&&!savedMulti(p))return false;if(view==='favs'",
