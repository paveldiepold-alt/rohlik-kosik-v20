
    
  
name: Rohlík Košík v20 - Kompletní katalog

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rk-v20-catalog
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout verified price-scanner branch
        uses: actions/checkout@v4
        with:
          ref: fix/real-product-price-reading-v20
          fetch-depth: 0

      - name: Add catalogue files from main without overwriting working price scanner
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          for file in catalog_search.py catalog_monitor.py tests/test_catalog_monitor.py docs/catalog.html; do
            if [ ! -f "$file" ]; then
              mkdir -p "$(dirname "$file")"
              git show "origin/main:$file" > "$file"
            fi
          done
          git add catalog_search.py catalog_monitor.py tests/test_catalog_monitor.py docs/catalog.html
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'catalog: bootstrap search and dashboard on verified price branch [skip ci]'
            git push origin HEAD:fix/real-product-price-reading-v20
          fi

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright Chromium
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium

      - name: Run catalogue and price tests
        run: python -m unittest discover -s tests -v

      - name: Search public catalogues and verify products
        id: scan
        continue-on-error: true
        run: python catalog_monitor.py

      - name: Upload diagnostics and checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rk-v20-catalog-results
          path: |
            docs/data/catalog_latest.json
            docs/data/catalog_progress.json
          if-no-files-found: warn
          retention-days: 30

      - name: Save results to verified branch
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/catalog_latest.json docs/data/catalog_progress.json docs/data/catalog_taxonomy_review.json || true
          if ! git diff --cached --quiet; then
            git commit -m 'data: catalogue scan checkpoint [skip ci]'
            git push origin HEAD:fix/real-product-price-reading-v20
          fi

      - name: Report collection status
        if: steps.scan.outcome != 'success'
        run: |
          echo '::error::Catalogue discovery incomplete or prices unverified. See scan summary and rk-v20-catalog-results artifact.'
          exit 1

