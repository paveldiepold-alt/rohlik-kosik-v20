      - name: Publish user dashboard before any network price checks
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/catalog.html maintenance_v26.py tests/test_maintenance_v26.py tests/test_site_v26.py
          if ! git diff --cached --quiet; then
            git commit -m 'ux: release usable deals monitor with saved favorites [skip ci]'
            git push origin HEAD:fix/real-product-price-reading-v20
          fi
      - name: Install price browser
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Recheck existing URLs in bounded rotating batch
        id: price
        continue-on-error: true
        env:
          CHECK_LIMIT: ${{ inputs.limit || '24' }}
        shell: bash
        run: |
          set -euo pipefail
          python maintenance_v26.py --limit "$CHECK_LIMIT" --delay 3.3
      - name: Upload price diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rk-v26-daily-price-diagnostics
          retention-days: 14
          if-no-files-found: warn
          path: |
            docs/data/monitor_v26_report.json
      - name: Persist verified prices when at least one source worked
        if: steps.price.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/catalog_latest.json docs/data/monitor_v26_report.json
          if ! git diff --cached --quiet; then
            git commit -m 'prices: daily bounded product detail validation [skip ci]'
            git push origin HEAD:fix/real-product-price-reading-v20
          fi
      - name: Summary of daily check
        if: always()
        shell: bash
        run: |
          if [ -f docs/data/monitor_v26_report.json ]; then
            python - <<'PYREPORT'
          import json,os
          d=json.load(open('docs/data/monitor_v26_report.json',encoding='utf8'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf8') as f:
              f.write('## Monitoring v26 – denní kontrola cen\n\n')
              f.write(f"- Kontrolováno: {d.get('processed',0)}\n- Ceny úspěšně načtené: {d.get('updated_prices',0)}\n- Nezjištěné ceny: {d.get('remaining_missing','?')}\n- Poklesy od minula: {len(d.get('new_drops',[]))}\n")
              f.write('\nNejde o plošné ověření všech produktů ani o potvrzení dostupnosti pro PSČ 149 00.\n')
          PYREPORT
          fi
      - name: Fail if no actual price was checked
        if: steps.price.outcome != 'success'
        run: |
          echo '::error::No usable price verified; dashboard update was preserved, but price monitor needs diagnostics.'
          exit 1
