name: Rohlík Košík v26 - Bezpečná denní kontrola cen (zachovat design)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/user_monitor_v26.yml
  workflow_dispatch:
    inputs:
      limit:
        description: 'Počet produktů ke kontrole (1-35)'
        default: '35'
        required: false
        type: string
  schedule:
    - cron: '13 */3 * * *'

permissions:
  contents: write

concurrency:
  group: rk-v20-catalog
  cancel-in-progress: false

jobs:
  daily-prices:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout current published v26 data and parser
        uses: actions/checkout@v4
        with:
          ref: fix/real-product-price-reading-v20
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate existing catalogue and snapshot the baseline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .price-monitor-safety
          python - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          limit = int(os.getenv('INPUT_LIMIT', '24'))
          assert 1 <= limit <= 35, 'Limit must be 1..35'
          source = Path('docs/data/catalog_latest.json')
          dashboard = Path('docs/catalog.html')
          assert source.is_file() and dashboard.is_file(), 'Published catalogue or HTML missing'
          cat = json.loads(source.read_text(encoding='utf-8'))
          items = cat['items']
          keys = [(x['store'], x['url']) for x in items]
          assert len(items) >= 1090, 'Product count is below baseline 1090'
          assert len(keys) == len(set(keys)), 'Duplicate product identity'
          shutil.copyfile(source, '.price-monitor-safety/before.json')
          Path('.price-monitor-safety/html.sha256').write_text(hashlib.sha256(dashboard.read_bytes()).hexdigest())
          print('Before: products:', len(items), 'priced:', sum(x.get('price_status') == 'ok' for x in items))
          PY
        env:
          INPUT_LIMIT: ${{ inputs.limit || '35' }}

      - name: Verify promotion parser offline
        shell: bash
        run: |
          python -m unittest discover -s tests -p 'test_visible_price.py' -v
          python -m unittest discover -s tests -p 'test_maintenance_v26.py' -v

      - name: Install price browser
        shell: bash
        timeout-minutes: 6
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'playwright==1.56.0'
          python -m playwright install chromium

      - name: Check saved product URLs, never crawl unrelated products
        id: price
        continue-on-error: true
        shell: bash
        env:
          CHECK_LIMIT: ${{ inputs.limit || '35' }}
        run: |
          set -euo pipefail
          python maintenance_v26.py --limit "$CHECK_LIMIT" --delay 3.3

      - name: Verify products, previously valid prices and dashboard untouched
        id: integrity
        if: steps.price.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          before = json.loads(Path('.price-monitor-safety/before.json').read_text(encoding='utf-8'))
          after = json.loads(Path('docs/data/catalog_latest.json').read_text(encoding='utf-8'))
          source = before['items']
          updated = after['items']
          identity = lambda p: (p['store'], p['url'])
          assert [identity(p) for p in source] == [identity(p) for p in updated], 'Product identity or ordering changed'
          assert len(updated) == len(source), 'Product lost or duplicated'
          assert before['generated_at'] == after['generated_at'], 'Source catalogue generation time changed'
          allowed_price_fields = {
            'price_czk', 'price_status', 'price_source', 'checked_at',
            'original_price_czk', 'discount_pct', 'offer_valid_until', 'multibuy',
            'price_history_previous_czk', 'price_history_previous_at', 'drop_since_previous_pct'
          }
          allowed_diag_fields = {
            'last_monitor_attempt_at', 'monitor_v26_attempts',
            'monitor_v26_status', 'monitor_v26_note'
          }
          for old, new in zip(source, updated):
            for field, value in old.items():
              if field not in allowed_price_fields | allowed_diag_fields:
                assert new.get(field) == value, (identity(old), field, 'unrelated field modified')
            assert set(old).issubset(set(new)), (identity(old), 'field deleted')
            if old.get('price_status') == 'ok':
              assert new.get('price_status') == 'ok', (identity(old), 'verified price lost')
              assert isinstance(new.get('price_czk'), (int,float)) and new['price_czk'] > 0
          expected_sha = Path('.price-monitor-safety/html.sha256').read_text()
          actual_sha = hashlib.sha256(Path('docs/catalog.html').read_bytes()).hexdigest()
          assert expected_sha == actual_sha, 'STOP: Public HTML was changed'
          priced_before = sum(p.get('price_status') == 'ok' for p in source)
          priced_after = sum(p.get('price_status') == 'ok' for p in updated)
          assert priced_after >= priced_before, 'Verified price coverage declined'
          report = json.loads(Path('docs/data/monitor_v26_report.json').read_text(encoding='utf-8'))
          assert report.get('processed',0) > 0
          assert report.get('updated_prices',0) > 0, 'No verified observations: do not publish'
          print('PASS:',len(updated),'products,',priced_before,'->',priced_after,'priced, public HTML unchanged')
          PY
          test -z "$(git status --porcelain -- docs/catalog.html)"

      - name: Upload standalone price diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rk-v26-safe-price-diagnostics
          retention-days: 14
          if-no-files-found: ignore
          path: docs/data/monitor_v26_report.json

      - name: Persist ONLY the two price data JSON files
        if: steps.price.outcome == 'success' && steps.integrity.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/data/catalog_latest.json docs/data/monitor_v26_report.json
          if ! git diff --cached --quiet; then
            git commit -m 'prices: safe verified refresh, dashboard unchanged [skip ci]'
            git push origin 'HEAD:refs/heads/fix/real-product-price-reading-v20'
          fi

      - name: Summary
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('docs/data/monitor_v26_report.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
            out.write('## Denní ověření cen – bezpečná verze\n\n')
            out.write('Design `docs/catalog.html` se tímto workflow nikdy nemění.\n\n')
            if p.is_file():
              data = json.loads(p.read_text(encoding='utf-8'))
              for k in ('processed','updated_prices','remaining_missing','blocked_stores'):
                out.write(f'- **{k}:** {data.get(k)}\n')
            else:
              out.write('Nový report nevznikl – zkontrolujte log.\n')
          PY

      - name: Do not count an unsuccessful pricing check as a successful refresh
        if: steps.price.outcome != 'success' || steps.integrity.outcome != 'success'
        shell: bash
        run: |
          echo '::error::No verified price updates: original catalogue and public dashboard remain unchanged.'
          exit 1
