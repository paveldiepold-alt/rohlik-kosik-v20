on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Playwright browser
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Check real product pages and prices
        shell: bash
        run: |
          python - <<'PYTHON_PROBE'
          import json
          import os
          import re
          import sys
          import unicodedata
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urlparse
          from playwright.sync_api import sync_playwright

          TARGETS = [
              'F_ZEWA_DELUXE_STANDARD_10X10',
              'F_ZEWA_DELUXE_STANDARD_KOSIK',
              'F_STUDENTSKA_PECET_KOSIK',
              'F_SYOSS_INTENSE_POWER_440_ROHLIK',
          ]
          SHOP_HOSTS = {'www.rohlik.cz', 'www.kosik.cz'}
          watch = json.loads(Path('watchlist.json').read_text(encoding='utf-8'))
          index = {p['id']: p for p in watch['specific_products']}
          missing = [pid for pid in TARGETS if pid not in index]
          if missing:
              sys.exit('ERROR - watchlist IDs not found: ' + ', '.join(missing))

