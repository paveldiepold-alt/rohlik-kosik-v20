              return ''.join(c for c in unicodedata.normalize('NFKD', s.casefold())
                             if not unicodedata.combining(c))

          def structured_prices(page):
              # Prices are taken ONLY from product-specific structured data.
              return page.evaluate('''() => {
                const out = [];
                const meta = document.querySelector('meta[itemprop="price"]');
                const curr = document.querySelector('meta[itemprop="priceCurrency"]');
                if (meta && meta.content) out.push({value: meta.content,
                  currency: curr ? curr.content : null, source: 'meta'});
                const visit = (node, depth=0) => {
                  if (!node || depth > 8) return;
                  if (Array.isArray(node)) { node.forEach(x=>visit(x,depth+1)); return; }
                  if (typeof node !== 'object') return;
                  const type = node['@type'];
                  if (type === 'Product' || (Array.isArray(type) && type.includes('Product'))) {
                    let offers = node.offers || [];
                    if (!Array.isArray(offers)) offers = [offers];
                    for (const o of offers) if (o && (o.price != null || o.lowPrice != null)) {
                      out.push({value: String(o.price ?? o.lowPrice),
                        currency: o.priceCurrency || null, source:'jsonld'});
                    }
                  }
                  for (const k of ['@graph','mainEntity']) if (node[k]) visit(node[k],depth+1);
                };
                for (const s of document.querySelectorAll('script[type="application/ld+json"]')) {
                  try { visit(JSON.parse(s.textContent)); } catch (_) {}
                }
                return out;
              }''')

          def read_price(page):
              offers = []
              for item in structured_prices(page):
                  raw = str(item.get('value', '')).replace('\u00a0','').replace(' ','').replace(',','.')
                  if not re.fullmatch(r'\d{1,6}(?:\.\d{1,2})?', raw):
                      continue
