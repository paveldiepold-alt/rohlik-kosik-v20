
    
  
name: Rohlik Kosik v20 - Overeni skutecnych cen

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install chromium

      - name: Test realneho nacteni cen
        shell: bash
        run: |
          cat > probe.py <<'PYTHON_PROBE'
          import json
          import os
          import re
          import sys
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          from playwright.sync_api import sync_playwright

          IDS = [
              'F_ZEWA_DELUXE_STANDARD_10X10',
              'F_ZEWA_DELUXE_STANDARD_KOSIK',
              'F_STUDENTSKA_PECET_KOSIK',
              'F_SYOSS_INTENSE_POWER_440_ROHLIK',
          ]

          def structured_price(page):
              values = page.evaluate('''() => {
                const out = [];
                for (const el of document.querySelectorAll('meta[itemprop="price"], meta[property="product:price:amount"]')) {
                  const price = el.getAttribute('content');
                  const currency = el.getAttribute('currency') || el.getAttribute('content-currency') || null;
                  if (price) out.push({price, currency, source: 'meta'});
                }
                function visit(item, depth = 0) {
                  if (depth > 10 || !item) return;
                  if (Array.isArray(item)) { item.forEach(x => visit(x, depth + 1)); return; }
                  if (typeof item !== 'object') return;
                  const types = [].concat(item['@type'] || []);
                  if (types.includes('Product')) {
                    const offers = [].concat(item.offers || []);
                    for (const offer of offers) {
                      if (offer && (offer.price != null || offer.lowPrice != null)) {
                        out.push({price: String(offer.price ?? offer.lowPrice), currency: offer.priceCurrency || null, source: 'jsonld'});
                      }
                    }
                  }
                  for (const key of ['@graph', 'mainEntity']) if (item[key]) visit(item[key], depth + 1);
                }
                for (const node of document.querySelectorAll('script[type="application/ld+json"]')) {
                  try { visit(JSON.parse(node.textContent)); } catch (e) {}
                }
                return out;
              }''')
              clean = []
              for item in values:
                  curr = str(item.get('currency') or '').upper().strip()
                  if curr and curr not in ('CZK', 'KČ'):
                      continue
                  raw = re.sub(r'\s+', '', str(item['price'])).replace(',', '.')
                  if re.fullmatch(r'\d{1,6}(?:\.\d{1,2})?', raw):
                      val = float(raw)
                      if val > 0:
                          clean.append((val, item['source']))
              unique = sorted(set(v for v, _ in clean))
              if len(unique) == 1:
                  return {'czk': unique[0], 'source': clean[0][1], 'postcode_verified': False}
              return None

          def check(page, entry):
              result = {
                  'id': entry['id'], 'shop': entry['store'], 'url': entry['url'],
                  'title': None, 'price': None, 'http_status': None,
                  'status': 'error', 'note': ''
              }

