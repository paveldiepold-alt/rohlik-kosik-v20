      - name: Audit already saved catalog - no store searches
        run: python run_quality_v24.py
      - name: Commit corrected category catalog and durable classifier
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add store_taxonomy.py catalog_quality_v24.py install_quality_v24.py run_quality_v24.py recheck_laundry_v24.py tests/test_catalog_quality_v24.py docs/data/catalog_latest.json docs/data/catalog_taxonomy_review.json docs/data/catalog_quality_v24.json
          if ! git diff --cached --quiet; then
            git commit -m 'taxonomy: use complete retailer path and exclude pet food, health products and seeds [skip ci]'
            git push origin HEAD:fix/real-product-price-reading-v20
          fi
      - name: Install Playwright Chromium for price pilot
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Check missing Košík laundry prices only (24 products maximum)
        id: laundry
        continue-on-error: true
        run: python recheck_laundry_v24.py --limit 24 --delay 3
      - name: Save price audit and verified prices, even on partial pilot
        if: always() && steps.quality.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/catalog_latest.json
          if [ -f docs/data/catalog_laundry_v24.json ]; then git add docs/data/catalog_laundry_v24.json; fi
          if ! git diff --cached --quiet; then
            git commit -m 'prices: diagnostic recheck of saved Košík laundry products [skip ci]'
            git push origin HEAD:fix/real-product-price-reading-v20
          fi
      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rk-v24-quality-and-prices
          path: |
            docs/data/catalog_quality_v24.json
            docs/data/catalog_laundry_v24.json
          if-no-files-found: warn
          retention-days: 14
      - name: Report incomplete price verification as a failure
        if: steps.laundry.outcome != 'success'
        run: |
          echo "::error::Laundry price pilot below 70% threshold or source unavailable. Category fixes are saved; inspect audit report. Do NOT retry immediately if throttled."
          exit 1
