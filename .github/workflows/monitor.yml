
    
  
name: Rohlík Košík v20 - Kontrola cen

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rk-v20-price-monitor
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Validate scanner
        run: python -m unittest discover -s tests -v
      - name: Observe known product pages
        id: observe
        continue-on-error: true
        run: python monitor.py
      - name: Save diagnostic result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rk-v20-results
          path: docs/data/*.json
          if-no-files-found: warn
      - name: Persist observations
        if: steps.observe.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/latest.json docs/data/history.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: update observed product prices [skip ci]'
            git push
          fi
      - name: Fail if no price was verified
        if: steps.observe.outcome != 'success'
        run: |
          echo '::error::No verified product prices. Open the rk-v20-results artifact for reasons.'
          exit 1

