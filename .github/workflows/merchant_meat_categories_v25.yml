name: Rohlik Kosik - Overeni masa podle kategorii obchodu
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rk-v20-catalog
  cancel-in-progress: false
jobs:
  check-meat:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout current published catalogue
        uses: actions/checkout@v4
        with:
          ref: fix/real-product-price-reading-v20
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install self-contained check and validation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          from pathlib import Path
          from base64 import b64decode
          files = {
          'retailer_meat_gate_v25.py': '',
          'install_meat_v25.py': '',
          'run_meat_v25.py': '',
          'test_meat_v25.py': '',
          }
          for name, content in files.items():
              Path(name).write_bytes(b64decode(content))
          PYCODE
          python -m py_compile retailer_meat_gate_v25.py run_meat_v25.py install_meat_v25.py
          python -m unittest test_meat_v25 -v
          python install_meat_v25.py .
          python install_meat_v25.py .
          python -m py_compile store_taxonomy.py catalog_monitor.py catalog_quality_v24.py
          python -m unittest discover -s tests -v
      - name: Install browser
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Read stored merchant categories for meat URLs only
        id: meat
        continue-on-error: true
        run: |
          python run_meat_v25.py --max-products 150 --delay 3.2
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rk-meat-v25-audit
          path: |
            docs/data/catalog_latest.json
            docs/data/catalog_taxonomy_review.json
          if-no-files-found: warn
          retention-days: 14
      - name: Commit taxonomy fixes only when meat validation succeeded
        if: steps.meat.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PYCODE'
          import json, os
          d=json.load(open('docs/data/catalog_latest.json'))
          v=d.get('meat_v25')
          if not v:raise SystemExit('STOP: no meat audit; no publish')
          print('MEAT AUDIT:',json.dumps(v,ensure_ascii=False))
          if v['checked'] > 0 and v['extracted'] < min(5,v['checked']):
              raise SystemExit('STOP: source metadata unavailable')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Skutecne kategorie Masa na Rohliku a Kosiku\n\n')
              for k,val in v.items():f.write(f'- {k}: {val}\n')
          PYCODE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add store_taxonomy.py retailer_meat_gate_v25.py docs/data/catalog_latest.json docs/data/catalog_taxonomy_review.json
          if ! git diff --cached --quiet; then
            git commit -m 'taxonomy: verify raw meat from retailer breadcrumb paths [skip ci]'
            git push origin HEAD:fix/real-product-price-reading-v20
          fi
      - name: Fail rather than showing false success
        if: steps.meat.outcome != 'success'
        run: |
          echo '::error::Merchant-category lookup failed; public catalog not modified.'
          exit 1
