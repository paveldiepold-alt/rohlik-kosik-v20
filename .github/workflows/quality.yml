name: Rohlik Kosik v20 - Oprava ovoce a zeleniny

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rk-v20-quality-fix
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Load repair tool from main
        uses: actions/checkout@v4
        with:
          ref: main
          path: runner

      - name: Load catalog and collected data
        uses: actions/checkout@v4
        with:
          ref: fix/real-product-price-reading-v20
          path: catalog
          fetch-depth: 0

      - name: Apply safe fruit and vegetable classification and audit
        working-directory: catalog
        run: python ../runner/quality_repair.py

      - name: Run regression tests
        working-directory: catalog
        run: python -m unittest discover -s tests -q

      - name: Save cleaned catalog to catalog branch
        working-directory: catalog
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog_monitor.py docs/data/catalog_latest.json docs/data/catalog_quality_excluded.json
          if git diff --cached --quiet; then
            echo 'No changes needed' >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m 'quality: correct fruit and vegetable categorization [skip ci]'
            git push origin HEAD:fix/real-product-price-reading-v20
          fi
          echo '## Katalog: oprava ovoce a zeleniny' >> "$GITHUB_STEP_SUMMARY"
          echo 'Katalog byl opraven bez noveho vyhledavani; vyrazene zaznamy jsou v docs/data/catalog_quality_excluded.json.' >> "$GITHUB_STEP_SUMMARY"
